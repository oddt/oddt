  <title id="title">ODDT icon: aldose reductase–M15, PDB 4LB3</title>
  <desc id="description">A compact schematic of M15 in a decorative teal protein pocket, based on PDB 4LB3. Eight ODDT-calculated contacts are shown: two gold hydrogen bonds to His110 and Trp111, one violet iodine halogen bond to Thr113, and five teal dotted hydrophobic contacts to Trp20, Trp111, Phe122, Leu300, and Tyr309.</desc>
