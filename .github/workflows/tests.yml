name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.toolkit }}, Vina ${{ matrix.vina }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        toolkit: [rdk, ob]
        vina: ["latest", "1.1.2"]
    env:
      ODDT_TOOLKIT: ${{ matrix.toolkit }}
      VINA_VERSION: ${{ matrix.vina }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: testenv
          environment-file: ${{ matrix.python-version == '3.12' && 'environment.yml' || '' }}
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false

      - name: Install Python 3.14 dependencies
        if: matrix.python-version == '3.14'
        run: |
          conda install --yes --override-channels --channel conda-forge \
            scikit-image xlsxwriter 'rdkit>=2026.03.1' 'openbabel>=3.2.1' 'vina>=1.2.7' \
            pytest pytest-xdist black --file requirements.txt

      - name: Install package and test dependencies
        run: |
          conda install --yes --override-channels --channel conda-forge \
            pip setuptools wheel pytest-cov
          python -m pip install --no-build-isolation --no-deps .

      - name: Install Vina
        run: |
          if [[ "$VINA_VERSION" == "1.1.2" ]]; then
            conda remove --yes vina
            conda install --yes --override-channels \
              --channel conda-forge --channel bioconda autodock-vina=1.1.2
            vina --version
          else
            python -c "import vina; print('Vina Python API', vina.__version__)"
          fi

      - name: Run pytest
        run: python -m pytest --cov=oddt -n 2 -v --durations=10 tests/

      - name: Run CLI tests
        run: |
          oddt_cli --help
          oddt_cli tests/data/dude/xiap/crystal_ligand.sdf -osmi
          oddt_cli tests/data/dude/xiap/actives_docked.sdf --similarity ifp --query tests/data/dude/xiap/crystal_ligand.sdf --cutoff 0.9 --receptor tests/data/dude/xiap/receptor_rdkit.pdb -ocsv
          oddt_cli tests/data/dude/xiap/actives_docked.sdf --similarity sifp --query tests/data/dude/xiap/crystal_ligand.sdf --cutoff 0.9 --receptor tests/data/dude/xiap/receptor_rdkit.pdb -ocsv
          oddt_cli tests/data/dude/xiap/actives_docked.sdf --similarity usr --query tests/data/dude/xiap/crystal_ligand.sdf --cutoff 0.3 -ocsv
          oddt_cli tests/data/dude/xiap/actives_docked.sdf --similarity usr_cat --query tests/data/dude/xiap/crystal_ligand.sdf --cutoff 0.3 -ocsv
          oddt_cli tests/data/dude/xiap/actives_docked.sdf --similarity electroshape --query tests/data/dude/xiap/crystal_ligand.sdf --cutoff 0.3 -ocsv
          oddt_cli tests/data/dude/xiap/actives_docked.sdf --score pleclinear --receptor tests/data/dude/xiap/receptor_rdkit.pdb -ocsv